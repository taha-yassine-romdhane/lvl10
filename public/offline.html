<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#0b1120" />
    <title>Offline — Level 10</title>
    <style>
      html, body { height: 100%; margin: 0; }
      body {
        display: flex; flex-direction: column; align-items: center; justify-content: center;
        gap: 16px; padding: 24px; box-sizing: border-box; text-align: center;
        background: #0b1120; color: #e2e8f0;
        font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
      }
      img { width: 72px; height: 72px; }
      h1 { margin: 0; font-size: 24px; }
      p { margin: 0; color: #94a3b8; max-width: 280px; line-height: 1.5; }
      button {
        margin-top: 8px; padding: 12px 28px; border: 0; border-radius: 12px;
        background: #6366f1; color: #fff; font-weight: 700; font-size: 16px;
      }
    </style>
  </head>
  <body>
    <img src="/icon-192.png" alt="" />
    <h1>You're offline</h1>
    <p>Level 10 is played live with friends — reconnect to jump back into your game.</p>
    <button onclick="location.reload()">Try again</button>
  </body>
</html>
